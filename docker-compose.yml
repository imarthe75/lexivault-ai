# =============================================================================
# LexiVault AI — Digital Vault Harmonized for CASMARTS 2026
# =============================================================================

services:

  # ===========================================================================
  # BACKEND (Flask API)
  # ===========================================================================
  flask_backend:
    build:
      context: .
      dockerfile: Dockerfile_Flask
    container_name: lexivault-backend
    environment:
      - POSTGRES_HOST=casmarts-core-db-primary
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=casmarts_secure_db_pwd_2026
      - POSTGRES_DB=lexivault
      
      - CELERY_BROKER_URL=redis://casmarts-core-cache:6379/4
      - CELERY_RESULT_BACKEND=redis://casmarts-core-cache:6379/4
      
      - CEPH_ENDPOINT_URL=http://casmarts-core-storage:8333
      - CEPH_ACCESS_KEY=admin
      - CEPH_SECRET_KEY=casmarts_secure_pwd
      - CEPH_BUCKET_NAME=lexivault
      
      - KAFKA_BOOTSTRAP_SERVERS=casmarts-core-redpanda:29092
      
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - SYSTEM_MASTER_KEY=${SYSTEM_MASTER_KEY:-casmarts_master_key_vault_2026}
      - TZ=America/Mexico_City
      - FLASK_DEBUG=1
    volumes:
      - ./backend:/app
      - /home/ia/ecosistema-casmarts/core-casmarts/data/paperless/consume:/export/paperless:rw
    networks:
      - aura-network
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile_celery
    container_name: lexivault-worker
    environment:
      - POSTGRES_HOST=casmarts-core-db-primary
      - CELERY_BROKER_URL=redis://casmarts-core-cache:6379/4
      - CELERY_RESULT_BACKEND=redis://casmarts-core-cache:6379/4
      - CEPH_ENDPOINT_URL=http://casmarts-core-storage:8333
      - CEPH_ACCESS_KEY=admin
      - CEPH_SECRET_KEY=casmarts_secure_pwd
      - CEPH_BUCKET_NAME=lexivault
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - SYSTEM_MASTER_KEY=${SYSTEM_MASTER_KEY:-casmarts_master_key_vault_2026}
      - TZ=America/Mexico_City
    volumes:
      - ./backend:/app
      - /home/ia/ecosistema-casmarts/core-casmarts/data/paperless/consume:/export/paperless:rw
    networks:
      - aura-network
    restart: unless-stopped
    depends_on:
      - flask_backend
      - clamav

  # ===========================================================================
  # SCANNING & SECURITY
  # ===========================================================================
  clamav:
    image: clamav/clamav-debian:latest
    container_name: lexivault-clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=true
      - TZ=America/Mexico_City
    networks:
      - aura-network
    restart: unless-stopped

  # ===========================================================================
  # FRONTEND (React)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend-react
    container_name: lexivault-frontend
    ports:
      - "8501:80"
    networks:
      - aura-network
    restart: unless-stopped

networks:
  aura-network:
    external: true
    name: aura-network
